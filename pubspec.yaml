name: statefulclickcounter
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  bloc: ^9.2.0
  dio: ^5.9.2
  easy_localization: ^3.0.7
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.0.10
  flutter_dotenv: ^6.0.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.4
  country_flags: ^3.0.0
  fl_chart: ^0.70.2
  go_router: ^14.8.1
  animations: ^2.0.11
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  assets:
    -  assets/images/
    -  assets/icons/
    -  assets/translations/
    -  .env

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Light.ttf
          weight: 300
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
